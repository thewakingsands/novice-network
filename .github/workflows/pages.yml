name: Updates

on:
  push:
    branches:
      - '**'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 签出仓库
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: 安装 pnpm
        uses: pnpm/action-setup@v6
      - name: 安装 Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'
          cache: 'pnpm'
      - name: 缓存 XIVAPI 图标查询
        uses: actions/cache@v6
        with:
          path: .cache/xivapi-v2
          key: xivapi-v2-${{ github.run_id }}
          restore-keys: xivapi-v2-
      - name: 安装依赖
        run: pnpm install --frozen-lockfile
      - name: 构建网站
        run: pnpm build
        env:
          PUBLIC_GA4_ID: ${{ secrets.PUBLIC_GA4_ID }}
          AFDIAN_USER_ID: ${{ secrets.AFDIAN_USER_ID }}
          AFDIAN_API_TOKEN: ${{ secrets.AFDIAN_API_TOKEN }}
      - name: 导出部署密钥
        if: github.ref == 'refs/heads/master'
        run: echo "$DEPLOY_KEY" > ci/deploy-key
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
      - name: 运行部署脚本
        if: github.ref == 'refs/heads/master'
        run: |
          chmod +x ./ci/deploy.sh
          ./ci/deploy.sh
